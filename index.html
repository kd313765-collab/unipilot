<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UniPilot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>UniPilot</h1>
    <p>Your personal college assistant</p>

    <h2>Add Task</h2>

    <input type="text" id="taskInput" placeholder="Subject Name">
    <input type="date" id="taskDate">
    <button onclick="addTask()">Add Task</button>

    <h2>Today's Tasks</h2>
    <ul id="taskList">
          </ul>
<div class="tip">
    <strong>Financial Tip of the Day</strong>
    <p>Save at least 10% of your pocket money.</p>
</div>
<h3>Your Badge</h3>
<p id="badge"></p>
<img src="img.jpeg" alt="My Image" width="300" height="200">

<div id="badgeText"></div>








</div>

<script src="script.js"></script>

</body>
</html>
